<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171a16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f3ed" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Basket — a small, well-made place to shop and sell." />
    <title>Basket · Mini E-Commerce</title>
    <script>
      // Set theme class before paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem("basket-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
